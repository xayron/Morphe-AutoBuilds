name: Manual Patch and Update

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App name (from apps/ folder)'
        required: true
        type: string
        default: 'youtube'
      source:
        description: 'Source name (from sources/ folder)'
        required: true
        type: string
        default: 'revanced'
      version:
        description: 'Specific version (leave empty for latest)'
        required: false
        type: string
        default: ''
      architecture:
        description: 'Architecture to build'
        required: false
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - universal
        default: 'universal'
      replace_in_release:
        description: 'Replace APK in existing release'
        required: true
        type: boolean
        default: true
      release_platform:
        description: 'Release platform'
        required: false
        type: choice
        options:
          - github
          - gitlab
        default: 'github'

jobs:
  manual-patch:
    runs-on: ubuntu-latest
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8192:8191
        options: --shm-size=1gb
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set Specific Version (if provided)
        if: ${{ inputs.version != '' }}
        run: |
          # Update app config with specific version
          for dir in apps/apkmirror apps/apkpure apps/uptodown; do
            config_file="$dir/${{ inputs.app_name }}.json"
            if [ -f "$config_file" ]; then
              echo "Updating $config_file with version ${{ inputs.version }}"
              # Update JSON with specific version (single line to avoid
              # indentation issues inside python -c)
              python3 -c "import json; p='$config_file'; c=json.load(open(p)); c['version']='${{ inputs.version }}'; json.dump(c, open(p, 'w'), indent=2)"
              echo "Updated: $config_file"
              break
            fi
          done
      
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Wait for FlareSolverr
        run: |
          echo "Waiting for FlareSolverr to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8192/ > /dev/null 2>&1; then
              echo "FlareSolverr is ready."
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done

      - name: Build APK
        env:
          APP_NAME: ${{ inputs.app_name }}
          SOURCE: ${{ inputs.source }}
          ARCH: ${{ inputs.architecture }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLARESOLVERR_URL: http://localhost:8192/v1
        run: |
          echo "🔧 Building ${{ inputs.app_name }} with ${{ inputs.source }} for ${{ inputs.architecture }} architecture..."
          python -m src
      
      - name: Find Built APK
        id: find-apk
        run: |
          # Find the built APK file(s)
          apk_files=$(ls -1 *.apk 2>/dev/null)
          if [ -z "$apk_files" ]; then
            echo "❌ No APK files found"
            exit 1
          fi
          
          # Fix for multi-line output in GitHub Actions
          {
            echo "apk_files<<EOF"
            echo "$apk_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          
          echo "apk_count=$(echo "$apk_files" | wc -l)" >> "$GITHUB_OUTPUT"
          
          # Print for debugging
          echo "Found these APKs:"
          echo "$apk_files"
      
      - name: Upload as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-apk-${{ inputs.app_name }}-${{ inputs.architecture }}
          path: "*.apk"
      
      - name: Check Existing GitHub Release
        if: ${{ inputs.replace_in_release == true && (inputs.release_platform == 'github' || inputs.release_platform == '') }}
        id: check-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            echo "✅ Release 'latest' exists"
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Release 'latest' does not exist"
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update GitHub Release
        if: ${{ inputs.replace_in_release == true && (inputs.release_platform == 'github' || inputs.release_platform == '') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Updating GitHub release..."

          if [ "${{ steps.check-release.outputs.release_exists }}" = "true" ]; then
            echo "⬆️ Uploading new assets (clobbering existing)..."
            gh release upload latest *.apk --clobber

            : > keep_apks.txt
            for apk in *.apk; do
              [ -f "$apk" ] || continue
              echo "$apk" >> keep_apks.txt
            done
            python scripts/cleanup_old_apks.py --release latest --keep-file keep_apks.txt
          else
            echo "🚀 Creating new release..."
            gh release create "latest" \
              --title "Morphe APKs - $(date +'%Y-%m-%d %H:%M')" \
              --notes "Initial release" \
              *.apk \
              --latest
          fi

          echo "✅ Release assets updated successfully!"

      - name: Update GitHub Release Notes
        if: ${{ inputs.replace_in_release == true && (inputs.release_platform == 'github' || inputs.release_platform == '') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --json assets --jq '.assets[].name' > current_assets.txt 2>/dev/null || touch current_assets.txt
          
          cat > release_notes.md << 'EOF'
          # Morphe APKs
          
          ## 📱 Available Apps
          EOF
          
          sort -u current_assets.txt | while read filename; do
            [ -n "$filename" ] || continue
            echo "- $filename" >> release_notes.md
          done
          
          cat >> release_notes.md << EOF
          
          ---
          
          **Last Update:** $(date)
          **Updated App:** ${{ inputs.app_name }}
          **Architecture:** ${{ inputs.architecture }}
          **Source:** ${{ inputs.source }}
          
          Auto-updates daily at 6 AM UTC.
          EOF

          gh release edit latest \
            --title "Morphe APKs - $(date +'%Y-%m-%d %H:%M')" \
            --notes-file release_notes.md

      - name: Show GitHub Download Links
        if: ${{ inputs.replace_in_release == true && (inputs.release_platform == 'github' || inputs.release_platform == '') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_url=$(gh release view latest --json url --jq .url 2>/dev/null || echo "")
          echo "🔗 Updated Release URL: $release_url"
          echo ""
          echo "📦 Direct APK links:"
          for apk in *.apk; do
            echo "  - $release_url/download/$apk"
          done

      - name: Install Publisher Dependencies
        if: ${{ inputs.replace_in_release == true && inputs.release_platform == 'gitlab' }}
        run: pip install requests

      - name: Publish to GitLab Releases
        if: ${{ inputs.replace_in_release == true && inputs.release_platform == 'gitlab' }}
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: "87288318"
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN secret is not set on this repo."
            exit 1
          fi
          mkdir -p ./release-apks
          cp -f *.apk ./release-apks/ 2>/dev/null || true
          python scripts/gitlab_publish_release.py \
            --apks-dir ./release-apks \
            --merge

      - name: Publish Summary
        if: ${{ inputs.replace_in_release == true }}
        run: |
          count=$(ls -1 *.apk 2>/dev/null | wc -l)
          echo "Published $count APK(s) to the release (${{ inputs.release_platform || 'github' }})."

      - name: Cleanup Version Override
        if: ${{ inputs.version != '' && always() }}
        run: |
          # Reset version to empty in configs
          for dir in apps/apkmirror apps/apkpure apps/uptodown; do
            config_file="$dir/${{ inputs.app_name }}.json"
            if [ -f "$config_file" ]; then
              echo "Resetting version in $config_file"
              python3 -c "import json; p='$config_file'; c=json.load(open(p)); c['version']=''; json.dump(c, open(p, 'w'), indent=2)"
            fi
          done
